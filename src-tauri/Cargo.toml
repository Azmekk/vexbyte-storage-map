[package]
name = "vexbyte_storage_map"
description = "Vexbyte Storage Map: a disk space explorer and duplicate finder for Windows."
default-run = "VexbyteStorageMap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vexbyte_storage_map"

[[bin]]
name = "VexbyteStorageMap"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
disk_scanner.workspace = true
duplicate_finder.workspace = true
file_actions.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
