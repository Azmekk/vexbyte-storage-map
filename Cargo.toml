[workspace]
resolver = "3"
members = [
    "crates/disk_scanner",
    "crates/duplicate_finder",
    "crates/file_actions",
    "crates/file_categories",
    "crates/mount_table",
    "src-tauri",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
disk_scanner = { path = "crates/disk_scanner" }
duplicate_finder = { path = "crates/duplicate_finder" }
file_actions = { path = "crates/file_actions" }
file_categories = { path = "crates/file_categories" }
mount_table = { path = "crates/mount_table" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# tauri-specta v2 is still a release candidate: specta and tauri-specta must be pinned to the exact
# same rc, and specta-typescript to the version that rc was built against.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

windows = "0.62"
rustix = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
